events {}

http {
  upstream django_upstream {
    server django:8000;
  }

  upstream golang_upstream {
    server golang:8080;
  }

  server {
    listen 80;

    # Auth + stores + admin -> Django
    location /api/auth/ {
      proxy_pass http://django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    location /api/stores/ {
      proxy_pass http://django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    location /admin/ {
      proxy_pass http://django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Products + health -> Go
    location /api/products/ {
      proxy_pass http://golang_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    location /health {
      proxy_pass http://golang_upstream/health;
      proxy_set_header Host $host;
    }
  }
}
