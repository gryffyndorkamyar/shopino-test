services:
  postgres:
    image: postgres:16
    container_name: shopino-postgres-compose
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 55432 was taken by another local container (postgres-k2)
      - "55433:5432"
    volumes:
      - shopino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: ./backend/django
    container_name: shopino-django
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  # دو کپی از سرویس محصول برای تقسیم بار
  golang1:
    build:
      context: ./backend/golang
    container_name: shopino-golang-1
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      GO_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  golang2:
    build:
      context: ./backend/golang
    container_name: shopino-golang-2
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      GO_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  gateway:
    image: nginx:1.27-alpine
    container_name: shopino-gateway
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - golang1
      - golang2

volumes:
  shopino_pgdata:
